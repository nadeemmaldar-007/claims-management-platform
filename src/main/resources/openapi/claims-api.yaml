  /api/v1/reports/performance:
    get:
      tags:
      - Reports
      summary: Performance
      description: "Per active officer for a period of whole days in UTC, both ends\
        \ included: decisions, approval rate, settled claims, the average hours from\
        \ submission to the first assignment and to the decision, and the total approved.\
        \ The default period is the 30 days up to and including today. An officer\
        \ sees their own team."
      operationId: performance
      parameters:
