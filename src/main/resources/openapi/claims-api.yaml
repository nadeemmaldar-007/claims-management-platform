  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: "1) choose your role in the dropdown, 2) enter userId and password\
        \ in the body, 3) Execute, 4) copy accessToken, click Authorize, paste the\
        \ token only."
      operationId: login
      parameters:
      - name: role
        in: query
        description: The role you log in as. It must be the role of the account.
        required: true
        schema:
          type: string
          enum:
          - CLAIMANT
