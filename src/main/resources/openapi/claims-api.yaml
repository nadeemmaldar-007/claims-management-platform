openapi: 3.1.0
info:
  title: Claims Management Platform API
  description: |
    Backend of the claims platform for motor and property claims in six markets (IN, SG, AU, JP, MY, TH).

    **How to log in**
    1. Open **Authentication, POST /api/v1/auth/login**.
    2. Choose your role in the **role** dropdown (CLAIMANT, OFFICER or MANAGER).
    3. Enter `userId` and `password` in the body and press **Execute**.
    4. Copy the `accessToken` from the response, click **Authorize** at the top and paste the token only.

    **Demo accounts (user ids)**: manager `manager.apac`; officers `officer.in`, `officer.sg`, `officer.au`, `officer.jp`, `officer.my`, `officer.th`; claimants `claimant.in`, `claimant.sg`, `claimant.au`, `claimant.jp`, `claimant.my`, `claimant.th`. The password of each account is documented in the README; the login example shows the one for `claimant.in`.

    **Errors** are returned as `application/problem+json` with a `code`, a `timestamp` and the `correlationId` of the request, which is also sent in the `X-Correlation-Id` response header.
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Policies
  description: "Policy reference data: own policies for claimants, maintenance for\
    \ managers."
- name: Authentication
  description: Log in and register. Public.
- name: Reports
  description: "Workload, performance, aging and exposure."
- name: Notifications
  description: In-app notifications.
- name: Users
  description: Own profile and user management.
- name: Markets
  description: "The six markets, their currencies and thresholds."
- name: Claims
  description: "First notice of loss, workflow and decisions."
paths:
  /api/v1/policies/{policyNumber}:
    get:
      tags:
      - Policies
      summary: Get a policy
      description: An officer reads a policy of their own market; a manager reads
        any policy.
      operationId: get
      parameters:
      - name: policyNumber
        in: path
        description: "Policy number, not case sensitive"
        required: true
        schema:
          type: string
        example: MOT-IN-0001
      responses:
        "200":
          description: The policy
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "403":
          description: Only an OFFICER or a MANAGER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "404":
          description: "Unknown policy, or a policy of another market than the officer's"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
    put:
      tags:
      - Policies
      summary: Create or update a policy
      description: "A manager creates the policy (201 with a Location header) or,\
        \ when the number already exists, updates it (200). The product type, the\
        \ market and the holder of an existing policy cannot be changed. The holder\
        \ must be an active claimant of the policy's market."
      operationId: upsert
      parameters:
      - name: policyNumber
        in: path
        description: "Policy number: 6 to 20 letters, digits or dashes; stored upper\
          \ case"
        required: true
        schema:
          type: string
        example: MOT-IN-0003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPolicyRequest"
        required: true
      responses:
        "200":
          description: The policy was updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "201":
          description: The policy was created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "400":
          description: "Validation failed, for example an unknown holder, a holder\
            \ of another market, a deductible above the sum insured, wrong decimal\
            \ places, or a change of an immutable field"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "403":
          description: Only a MANAGER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PolicyResponse"
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List users
      description: "A manager lists accounts, optionally filtered by role and market.\
        \ Size defaults to 10 and is capped at 50. Sort by userId or createdAt, for\
        \ example sort=createdAt,desc."
      operationId: list
      parameters:
      - name: role
        in: query
        description: Only users with this role
        required: false
        schema:
          type: string
          enum:
          - CLAIMANT
          - OFFICER
          - MANAGER
      - name: marketCode
        in: query
        description: "Only users of this market, for example IN"
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: "Page number, starting at 0"
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: "Page size, default 10, maximum 50"
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: "Sort: userId or createdAt, optionally followed by ,asc or ,desc"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: A page of users
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
        "400":
          description: "Invalid filter, page, size or sort"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
        "403":
          description: Only a MANAGER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserResponse"
    post:
      tags:
      - Users
      summary: Create a staff account
      description: A manager creates an OFFICER (market required) or a MANAGER (no
        market). Claimants register themselves.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: Account created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: "Validation failed, or the market rule for the role is broken"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          description: Only a MANAGER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "409":
          description: The user ID or the email is already in use
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/v1/notifications/{id}/read:
    post:
      tags:
      - Notifications
      summary: Mark one notification as read
      description: "Someone else's notification, and an id that does not exist, are\
        \ both reported as not found."
      operationId: markRead
      parameters:
      - name: id
        in: path
        description: Id of the notification
        required: true
        schema:
          type: integer
          format: int64
        example: 12
      responses:
        "200":
          description: "The notification, now read"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "404":
          description: "Unknown id, or a notification of another user"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/NotificationResponse"
  /api/v1/notifications/read-all:
    post:
      tags:
      - Notifications
      summary: Mark all my notifications as read
      operationId: readAll
      responses:
        "200":
          description: How many notifications changed
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadAllResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReadAllResponse"
  /api/v1/claims:
    get:
      tags:
      - Claims
      summary: List claims
      description: "Lists the claims the caller may see: a claimant their own, an\
        \ officer those of their market, a manager all. Filter by status, type, market,\
        \ assignee or submission date (both dates inclusive). Size defaults to 10\
        \ and is capped at 50. Sort by createdAt, claimedAmount, incidentDate or claimNumber,\
        \ for example sort=claimedAmount,desc; the default is createdAt,desc."
      operationId: list_1
      parameters:
      - name: status
        in: query
        description: Only claims in this status
        required: false
        schema:
          type: string
          enum:
          - SUBMITTED
          - UNDER_REVIEW
          - PENDING_INFORMATION
          - ESCALATED
          - APPROVED
          - REJECTED
          - SETTLED
      - name: claimType
        in: query
        description: Only claims of this type
        required: false
        schema:
          type: string
          enum:
          - MOTOR
          - PROPERTY
      - name: marketCode
        in: query
        description: "Only claims of this market, for example IN"
        required: false
        schema:
          type: string
      - name: assignedTo
        in: query
        description: "me, or the user id of an officer"
        required: false
        schema:
          type: string
      - name: unassigned
        in: query
        description: "true for claims nobody has taken, false for claims that have\
          \ an officer"
        required: false
        schema:
          type: boolean
      - name: submittedFrom
        in: query
        description: "Submitted on or after this day (UTC), yyyy-MM-dd"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-01
      - name: submittedTo
        in: query
        description: "Submitted on or before this day (UTC), yyyy-MM-dd"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-31
      - name: page
        in: query
        description: "Page number, starting at 0"
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: "Page size, default 10, maximum 50"
        required: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: "createdAt, claimedAmount, incidentDate or claimNumber, optionally\
          \ with ,asc or ,desc"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: A page of claims
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClaimSummaryResponse"
        "400":
          description: "Invalid filter, date range, page, size or sort"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClaimSummaryResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseClaimSummaryResponse"
    post:
      tags:
      - Claims
      summary: Submit a claim (first notice of loss)
      description: "A claimant reports an incident under one of their own policies.\
        \ Give the motor block for a MOTOR claim or the property block for a PROPERTY\
        \ claim, never both. The claim takes the currency of your market. With an\
        \ Idempotency-Key header (8 to 64 characters) a repeated request returns the\
        \ original claim with status 200 and the header Idempotent-Replay: true instead\
        \ of creating a second claim."
      operationId: submit
      parameters:
      - name: Idempotency-Key
        in: header
        description: Optional key that makes the submission safe to repeat; 8 to 64
          characters
        required: false
        schema:
          type: string
        example: 7d9f3c52-claim-0001
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitClaimRequest"
            examples:
              Motor claim:
                summary: A full MOTOR claim
                description: Motor claim
                value:
                  claimType: MOTOR
                  policyNumber: MOT-IN-0001
                  claimedAmount: 45000.0
                  incidentDate: 2026-10-15
                  incidentLocation: "MG Road, Bengaluru"
                  description: Rear-ended at a traffic signal; bumper and boot lid
                    damaged.
                  motor:
                    vehicleRegistrationNumber: MH12AB1234
                    vehicleMake: Hyundai
                    vehicleModel: i20
                    vehicleYear: 2021
                    damageType: COLLISION
                    policeReportNumber: FIR-2026-5521
              Property claim:
                summary: A full PROPERTY claim
                description: Property claim
                value:
                  claimType: PROPERTY
                  policyNumber: PRP-IN-0001
                  claimedAmount: 250000.0
                  incidentDate: 2026-10-15
                  incidentLocation: "Powai, Mumbai"
                  description: Heavy rain flooded the ground floor; flooring and furniture
                    damaged.
                  property:
                    propertyAddress: "Flat 402, Lakeview Apartments, Powai, Mumbai\
                      \ 400076"
                    propertyType: RESIDENTIAL
                    perilType: FLOOD
        required: true
      responses:
        "201":
          description: Claim created; the Location header points to it
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "200":
          description: "Replay: the idempotency key was used before; the original\
            \ claim is returned with the header Idempotent-Replay: true"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: "Validation failed, for example a wrong or missing motor or\
            \ property block, a bad date or amount, or an idempotency key of the wrong\
            \ length"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: Only a CLAIMANT may submit a claim
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "DUPLICATE_CLAIM: a claim for the same policy, incident date\
            \ and type exists and is not rejected"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "422":
          description: "Policy rule broken: POLICY_NOT_FOUND, POLICY_NOT_ACTIVE, POLICY_TYPE_MISMATCH,\
            \ POLICY_MARKET_MISMATCH or AMOUNT_EXCEEDS_SUM_INSURED"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/settle:
    post:
      tags:
      - Claims
      summary: Settle an approved claim
      description: "The assigned officer or a manager pays an APPROVED claim through\
        \ the payment gateway. The amount paid is the approved amount. The gateway\
        \ is called before anything is written: if it is not available the answer\
        \ is 502 and the claim stays APPROVED, with no timeline entry and no event.\
        \ Asking again after a failure succeeds, and a claim is never paid twice."
      operationId: settle
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleClaimRequest"
            examples:
              Bank transfer:
                description: Bank transfer
                value:
                  paymentMethod: BANK_TRANSFER
                  remarks: Paid to the account on file.
        required: true
      responses:
        "200":
          description: "The claim, now SETTLED, with its settlement block"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: paymentMethod is missing or not BANK_TRANSFER or CHEQUE
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: "A claimant, or an officer who is not the assigned officer"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "CLAIM_INVALID_TRANSITION: only an APPROVED claim can be settled,\
            \ and a claim is settled once"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "502":
          description: "PAYMENT_GATEWAY_UNAVAILABLE: the claim stays APPROVED"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/reject:
    post:
      tags:
      - Claims
      summary: Reject a claim
      description: The reason code and the remarks are the explanation the claimant
        is shown. A request for information that is still open is cancelled with the
        claim. An escalated claim can be rejected by a manager only.
      operationId: reject
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
            examples:
              Not covered:
                description: Not covered
                value:
                  reasonCode: NOT_COVERED
                  remarks: Flood damage is not covered by this motor policy.
        required: true
      responses:
        "200":
          description: "The claim, now REJECTED"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: reasonCode or remarks is missing or invalid
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: "Not the assigned officer, or an officer on an escalated claim"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "CLAIM_INVALID_TRANSITION: the claim is in a status that cannot\
            \ be rejected"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/pick-up:
    post:
      tags:
      - Claims
      summary: Pick up a claim
      description: The caller takes a SUBMITTED claim from the queue and starts the
        review. If another officer took it first the answer is 409 CLAIM_ALREADY_ASSIGNED.
      operationId: pickUp
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      responses:
        "200":
          description: "The claim, now UNDER_REVIEW and assigned to the caller"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: Only an OFFICER or a MANAGER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "CLAIM_ALREADY_ASSIGNED: someone else took the claim; CLAIM_INVALID_TRANSITION:\
            \ the claim is in a status that cannot be picked up"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/information-requests:
    get:
      tags:
      - Claims
      summary: List the information requests of a claim
      description: "Oldest first. A claimant sees the requests of their own claims,\
        \ with staff shown as \"Claims team\"; staff see those of the claims in their\
        \ scope. overdue is true for an OPEN request whose due time has passed."
      operationId: list_2
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      responses:
        "200":
          description: The requests
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InformationRequestResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InformationRequestResponse"
        "404":
          description: "Unknown claim, or a claim the caller may not see"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InformationRequestResponse"
    post:
      tags:
      - Claims
      summary: Ask the claimant for information
      description: The assigned officer or a manager puts a question to the claimant.
        The claim must be UNDER_REVIEW and becomes PENDING_INFORMATION. dueInDays
        (1 to 30) defaults to the configured number of days.
      operationId: create_1
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInformationRequest"
        required: true
      responses:
        "201":
          description: The new request; the Location header points to the list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InformationRequestResponse"
        "400":
          description: "question is missing or not 10 to 1000 characters, or dueInDays\
            \ is outside 1 to 30"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InformationRequestResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InformationRequestResponse"
        "403":
          description: "A claimant, or an officer who is not the assigned officer"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InformationRequestResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InformationRequestResponse"
        "409":
          description: "CLAIM_INVALID_TRANSITION: only an UNDER_REVIEW claim can be\
            \ put on hold for information"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InformationRequestResponse"
  /api/v1/claims/{claimNumber}/information-requests/{requestId}/respond:
    post:
      tags:
      - Claims
      summary: Answer an information request
      description: "Only the claimant of the claim can answer, and only a request\
        \ that is still OPEN. Once no request is left OPEN the claim goes back to\
        \ UNDER_REVIEW. The answer is text only."
      operationId: respond
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      - name: requestId
        in: path
        description: Id of the information request
        required: true
        schema:
          type: integer
          format: int64
        example: 5
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondToInformationRequest"
        required: true
      responses:
        "200":
          description: The claim
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: responseText is missing or not 10 to 2000 characters
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: Only a CLAIMANT may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, a claim of another claimant, or a request that\
            \ belongs to another claim"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "INFORMATION_REQUEST_NOT_OPEN: already answered or cancelled"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/information-requests/{requestId}/cancel:
    post:
      tags:
      - Claims
      summary: Cancel an information request
      description: The assigned officer or a manager withdraws a question that is
        still OPEN. When no request is left OPEN the claim goes back to UNDER_REVIEW.
      operationId: cancel
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      - name: requestId
        in: path
        description: Id of the information request
        required: true
        schema:
          type: integer
          format: int64
        example: 5
      responses:
        "200":
          description: The claim
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: "A claimant, or an officer who is not the assigned officer"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, a claim outside the caller's market, or a request\
            \ that belongs to another claim"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "INFORMATION_REQUEST_NOT_OPEN: already answered or cancelled"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/escalate:
    post:
      tags:
      - Claims
      summary: Escalate a claim to a manager
      description: "The assigned officer passes a claim that is UNDER_REVIEW to the\
        \ managers, for example because the payout is above their approval limit.\
        \ The remarks are shown to staff; the claimant is told only that the claim\
        \ went to a manager."
      operationId: escalate
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalateRequest"
        required: true
      responses:
        "200":
          description: "The claim, now ESCALATED"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: remarks is missing or not 10 to 1000 characters
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: Only the assigned OFFICER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "CLAIM_INVALID_TRANSITION: only an UNDER_REVIEW claim is escalated"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/assign:
    post:
      tags:
      - Claims
      summary: Assign or reassign a claim
      description: "A manager gives the claim to an active officer of the claim's\
        \ market. From SUBMITTED this starts the review; from UNDER_REVIEW, PENDING_INFORMATION\
        \ or ESCALATED it is a reassignment that keeps the status and is recorded\
        \ as an internal timeline entry."
      operationId: assign
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignClaimRequest"
        required: true
      responses:
        "200":
          description: The claim with its new officer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: officerUserId is missing
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: Only a MANAGER may do this
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: Unknown claim
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "CLAIM_INVALID_TRANSITION: the claim can no longer be assigned"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "422":
          description: "officerUserId is not an active officer of the claim's market,\
            \ or is already the assigned officer"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
  /api/v1/claims/{claimNumber}/assessments:
    get:
      tags:
      - Claims
      summary: List the assessments of a claim
      description: Newest first; the first one is the latest and the one that counts.
      operationId: list_3
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      responses:
        "200":
          description: The assessments
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResponse"
        "403":
          description: A claimant may not read assessments
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResponse"
    post:
      tags:
      - Claims
      summary: Record an assessment
      description: "The assigned officer or a manager records the facts of the assessment\
        \ while the claim is UNDER_REVIEW or ESCALATED. The system computes the deductible\
        \ (the claim's own) and the recommended payout: with coverage confirmed, the\
        \ lower of the assessed loss and the sum insured minus the deductible, never\
        \ below zero; without coverage, zero. Assessments are internal."
      operationId: record
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordAssessmentRequest"
            examples:
              Coverage confirmed:
                description: Coverage confirmed
                value:
                  assessedLossAmount: 44000.0
                  coverageConfirmed: true
                  recommendation: APPROVE
                  notes: Photos match the repair estimate.
        required: true
      responses:
        "201":
          description: The assessment; the Location header points to the list
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "400":
          description: "Invalid loss amount (or too many decimal places), missing\
            \ field"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "403":
          description: "A claimant, or an officer who is not the assigned officer"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
        "409":
          description: "CLAIM_INVALID_TRANSITION: only an UNDER_REVIEW or ESCALATED\
            \ claim can be assessed"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AssessmentResponse"
  /api/v1/claims/{claimNumber}/approve:
    post:
      tags:
      - Claims
      summary: Approve a claim
      description: "Needs a latest assessment that confirms coverage with a payout\
        \ above zero. The approved amount defaults to that payout and may be lower,\
        \ never higher. An officer may approve up to the market's escalation threshold\
        \ only; a manager has no limit. An escalated claim can be approved by a manager\
        \ only. The body may be left out."
      operationId: approve
      parameters:
      - name: claimNumber
        in: path
        description: Claim number
        required: true
        schema:
          type: string
        example: CLM-10003
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
            examples:
              Approve for less:
                description: Approve for less
                value:
                  approvedAmount: 39000.0
                  remarks: Approved as assessed.
      responses:
        "200":
          description: "The claim, now APPROVED"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "400":
          description: Invalid amount or too many decimal places for the currency
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "401":
          description: No valid token
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "403":
          description: "Not the assigned officer, or an officer on an escalated claim"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "404":
          description: "Unknown claim, or a claim outside the caller's market"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "409":
          description: "ASSESSMENT_REQUIRED, CLAIM_INVALID_TRANSITION or CONCURRENT_MODIFICATION"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
        "422":
          description: "APPROVAL_LIMIT_EXCEEDED, or approvedAmount above the recommended\
            \ payout"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClaimDetailResponse"
