              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: "Invalid user ID, password or role (the same answer for every\
            \ kind of failure)"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
      security: []
