        schema:
          type: string
          format: date
        example: 2026-09-26
      - name: to
        in: query
        description: "Last day of the period (UTC), yyyy-MM-dd; default today"
        required: false
        schema:
          type: string
          format: date
        example: 2026-10-25
      - name: marketCode
        in: query
        description: "A manager can narrow the report to one market, for example IN.\
          \ An officer always sees their own market only: another market gives an\
          \ empty report."
        required: false
        schema:
          type: string
        example: IN
      responses:
        "200":
          description: One row per officer
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerformanceResponse"
        "400":
          description: "from is after to, a date is invalid, or the market code is\
            \ unknown"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerformanceResponse"
        "401":
          description: No valid token
          content:
            '*/*':
